# Every job calls a make target, so a contributor runs exactly what CI runs.
#
# The skip classes are dealt with rather than tolerated: `python` installs a
# browser so the renderer tests actually execute, `node-chrome` installs Chrome
# so the warm-profile tests do, and `python-bare` exists to make the
# dependency-free claim real rather than asserted inside a virtualenv that has
# everything.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # The two guards that decide whether this repo is publishable at all.
      #
      # The names the first guard suppresses are supplied from outside the
      # repository, because a guard that hardcodes them publishes them. This is
      # empty on pull requests from forks — GitHub does not give them secrets —
      # so there the guard runs on its generic patterns alone. That is expected,
      # not a misconfiguration.
      - run: pytest -q tests/test_no_private_references.py tests/test_console_scripts.py
        env:
          CRAWLKIT_FORBIDDEN_NAMES: ${{ secrets.CRAWLKIT_FORBIDDEN_NAMES }}

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m "not chrome and not live and not corpus"

  python-bare:
    # No extras. If the probe, state or fanout layers have grown a dependency,
    # this is where it surfaces — the purity test alone cannot tell, because it
    # runs in an environment where everything is importable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: pip install pytest
      - run: pytest -q -m "not playwright and not chrome and not live and not corpus"

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The node suite drives the python fixture server, whose media routes
      # generate JPEGs. A python with no imaging library serves an error there,
      # and it surfaces as a capture assertion failing for no visible reason.
      - run: pip install -e '.[qa]'
      - run: npm ci --prefix node
      - run: node --test node/test/*.test.js

  node-chrome:
    # Separate from `node` so a Chrome install flake cannot mask a unit failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pip install -e '.[qa]'
      - run: npm ci --prefix node
      - run: node --test node/test/*.test.js
        env:
          CRAWLKIT_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  examples:
    # Proves the commands in the documentation still work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e '.[dev]'
      # Without this the browser examples self-skip, and a job that skips the
      # examples it exists to run is worth nothing.
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix node
      - run: pytest -q tests/test_examples.py
